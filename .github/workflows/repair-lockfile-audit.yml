name: Repair audit lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/repair-lockfile-audit.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/p0-real-production-audit-20260824' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-real-production-audit-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile"
          git push origin HEAD:codex/p0-real-production-audit-20260824
