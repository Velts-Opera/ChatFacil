name: Production health

on:
  pull_request:
    paths:
      - ".github/workflows/production-health.yml"
      - "scripts/ops/health-check.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-health.yml"
      - "scripts/ops/health-check.mjs"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe production contracts
        env:
          CHATFACIL_APP_URL: https://chatfacil-sigma.vercel.app
          CHATFACIL_FUNCTIONS_URL: https://ncosftsthrzznevzkvbi.supabase.co/functions/v1
        run: node scripts/ops/health-check.mjs

      - name: Open or update incident issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[alerta] Falha no health check de produção";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = data.find((issue) => issue.title === title);
            const body = `Falha detectada em ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close recovered incident issue
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[alerta] Falha no health check de produção";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recuperação confirmada em ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
